<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кланы — KristallCommunity</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/decorations.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- НАВИГАЦИЯ (HEADER) — ИСПРАВЛЕННЫЙ ИДЕАЛЬНЫЙ ВАРИАНТ -->
    <header>
        <div class="container header-wrapper" style="display: flex; justify-content: space-between; align-items: center; position: relative;">
            
            <!-- Левая часть: Логотип -->
            <a href="index.html" class="logo">KristallCommunity</a>
            
            <!-- Правая часть: Меню и Аватарки -->
            <div style="display: flex; align-items: center; gap: 20px;">
                
                <!-- Меню навигации -->
                <nav id="nav-menu">
                    <!-- Профиль для ТЕЛЕФОНОВ (виден только внутри шторки бургера) -->
                    <div class="menu-profile mobile-profile-block" style="display: none; align-items: center; gap: 10px; padding-bottom: 20px; border-bottom: 1px solid #1f2937; margin-bottom: 20px; cursor: pointer;">
                        <span id="header-avatar-img-mobile"></span>
                        <span class="menu-username" id="header-username-mobile">Гость</span>
                    </div>
                    <ul>
                        <li><a href="index.html">Главная</a></li>
                        <li><a href="projects.html">Проекты</a></li>
                        <li><a href="marketplace.html">Магазин</a></li>
                        <li><a href="clans.html" class="active">Кланы</a></li>
                    </ul>
                </nav>

                <!-- ПРОФИЛЬ ДЛЯ ПК -->
                <div class="pc-profile-block" id="user-profile-block" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <span id="header-avatar-img-pc"></span>
                    <span class="menu-username" id="header-username" style="color: white; font-weight: bold; font-size: 14px;">Гость</span>
                </div>

                <!-- Кнопка Бургера -->
                <button class="burger-menu" id="burger-btn" aria-label="Открыть меню">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main class="container" style="max-width: 1000px; margin: 40px auto; padding: 0 20px; box-sizing: border-box;">
        
        <!-- Заголовок секции и кнопка регистрации -->
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; margin-bottom: 30px;">
            <div style="flex: 1; min-width: 280px;">
                <h1 style="font-size: 32px; font-weight: 800; margin: 0 0 10px 0; background: linear-gradient(to right, #ffffff, #cbd5e1); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;">Кланы</h1>
                <p style="color: #9ca3af; font-size: 16px; margin: 0; line-height: 1.5;">Официальный рейтинг сильнейших объединений в KristallCommunity. Набирайте очки и выводите свой клан на первое место!</p>
            </div>
            <div style="flex-shrink: 0;">
                <a href="https://forms.gle/GhPbA8VFjdXCZs7QA" target="_blank" style="display: inline-flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: #ffffff; text-decoration: none; font-weight: bold; font-size: 14px; padding: 12px 20px; border-radius: 8px; box-shadow: 0 4px 14px rgba(6, 182, 212, 0.3); transition: transform 0.2s, box-shadow 0.2s;">
                    <svg xmlns="http://w3.org" width="16" height="16" fill="currentColor" viewBox="0 0 16 16" style="flex-shrink: 0;">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
                        <path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/>
                    </svg>
                    <span>Зарегистрировать клан</span>
                </a>
            </div>
        </div>

        <!-- ТАБЛИЦА ТОП КЛАНОВ -->
        <div style="background-color: #1a2332; border-radius: 12px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); width: 100%; box-sizing: border-box;">
            <div style="width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;">
                <table id="clans-table" style="width: 100%; border-collapse: collapse; font-size: 14px; color: #cbd5e1; text-align: left; min-width: 600px;">
                    <thead>
                        <tr style="background-color: rgba(15, 23, 42, 0.4); border-bottom: 1px solid #334155; color: #94a3b8; font-weight: bold;">
                            <th style="padding: 16px 20px; width: 90px; text-align: center;">Место</th>
                            <th style="padding: 16px 20px;">Название клана</th>
                            <th style="padding: 16px 20px; width: 130px; text-align: center;">Участники</th>
                            <th style="padding: 16px 20px; width: 140px; text-align: right;">Очки клана</th>
                            <th style="padding: 16px 20px; width: 150px; text-align: center;">Связь</th>
                        </tr>
                    </thead>
                    <tbody id="clans-list-container">
                        <!-- Заполняется из JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- СВЯЗКА СКРИПТОВ -->
    <script src="js/core.js"></script>
    <script src="js/content.js"></script>
    <script src="js/interface.js"></script>
    <script src="js/app.js"></script>
    <!-- Сюда мы подключим отдельный скрипт для кланов -->
    <script src="js/clans.js"></script>
</body>
</html>
