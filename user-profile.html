<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя — KristallCommunity</title>
    <!-- Иконка сайта -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Подключение стильного файла стилей -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/social.css">
    <link rel="stylesheet" href="css/decorations.css">
    <link rel="manifest" href="manifest.json">
</head>
<body style="background-color: #0f172a; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #ffffff;">

    <!-- НАВИГАЦИЯ (HEADER) -->
    <header>
        <div class="container header-wrapper" style="display: flex; justify-content: space-between; align-items: center; position: relative;">
            
            <!-- Левая часть: Логотип -->
            <a href="index.html" class="logo">KristallCommunity</a>
            
            <!-- Правая часть: Меню и Аватарки -->
            <div style="display: flex; align-items: center; gap: 20px;">
                
                <!-- Меню навигации -->
                <nav id="nav-menu">
                    <!-- Профиль для ТЕЛЕФОНОВ (виден только внутри шторки бургера) -->
                    <div class="menu-profile mobile-profile-block" style="display: none; align-items: center; gap: 10px; padding-bottom: 20px; border-bottom: 1px solid #1f2937; margin-bottom: 20px; cursor: pointer;">
                        <span id="header-avatar-img-mobile"></span>
                        <span class="menu-username" id="header-username-mobile">Гость</span>
                    </div>
                    <ul>
                        <li><a href="index.html">Главная</a></li>
                        <li><a href="projects.html">Проекты</a></li>
                        <li><a href="marketplace.html">Магазин</a></li>
                        <li><a href="clans.html">Кланы</a></li>
                        <li><a href="https://kristallc.github.io/Kristall-Archive/">Архив</a></li>
                    </ul>
                </nav>

                <!-- ПРОФИЛЬ ДЛЯ ПК (Красиво стоит справа от меню на больших экранах) -->
                <div class="pc-profile-block" id="user-profile-block" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <span id="header-avatar-img-pc"></span>
                    <span class="menu-username" id="header-username" style="color: white; font-weight: bold; font-size: 14px;">Гость</span>
                </div>

                <!-- Кнопка Бургера (3 полоски для мобилок) -->
                <button class="burger-menu" id="burger-btn" aria-label="Открыть меню">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- ОСНОВНОЙ КОНТЕНТ ПРОФИЛЯ -->
    <main class="container" style="max-width: 1000px; margin: 40px auto; padding: 0 20px; box-sizing: border-box;">
        
        <!-- Верхняя карточка: Инфо о пользователе -->
        <div style="background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 30px; display: flex; gap: 25px; flex-wrap: wrap; align-items: center; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); margin-bottom: 30px;">
            <div id="avatar-wrapper" class="skeleton-shimmer" style="width: 100px; height: 100px; border-radius: 50%; background-color: #1f2937; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; border: 2px solid #22d3ee;">
                <!-- Сюда JS подставит аватарку разработчика -->
            </div>
            <div style="flex: 1; min-width: 250px;">
                <h1 id="username" style="margin: 0 0 8px 0; font-size: 28px; font-weight: 800; color: white;">Загрузка...</h1>
                <p id="bio" style="margin: 0; color: #9ca3af; font-size: 14px; line-height: 1.6; text-align: left;"></p>
            </div>
        </div>

        <!-- ДВУХКОЛОНОЧНЫЙ БЛОК НАГРАД И ПРОЕКТОВ -->
        <div style="display: flex; gap: 30px; flex-wrap: wrap;">
            
            <!-- Левая колонка: Награды -->
            <div style="flex: 1; min-width: 300px; background-color: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); height: max-content; box-sizing: border-box;">
                <h3 style="color: #f59e0b; font-size: 15px; font-weight: bold; margin-top: 0; margin-bottom: 20px; letter-spacing: 0.5px; text-transform: uppercase;">🏆 Награды & Достижения</h3>
                <div id="awards-container" style="display: flex; flex-direction: column; gap: 15px;">
                    <!-- Сюда JS подгрузит награды из users.json -->
                </div>
            </div>

            <!-- Правая колонка: Список его проектов -->
            <div style="flex: 2; min-width: 350px; box-sizing: border-box;">
                <h2 style="color: #22d3ee; font-size: 20px; font-weight: bold; margin-top: 0; margin-bottom: 20px; text-align: left;">Проекты автора (<span id="projects-count">0</span>)</h2>
                <div id="projects-grid" class="projects-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;">
                    <!-- Сюда JS подгрузит карточки игр автора из общего каталога -->
                </div>
            </div>

        </div>
    </main>

    <!-- СВЯЗКА СКРИПТОВ -->
    <script src="js/core.js"></script>
    <script src="js/content.js"></script>
    <script src="js/interface.js"></script>
    <script src="js/app.js"></script>
    
    <!-- Отдельный скрипт обработки профиля разработчика -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadDeveloperProfile === 'function') loadDeveloperProfile();
        });
    </script>

    <!-- Контейнер для красивых уведомлений сайта -->
    <div id="kristall-toast"></div>
</body>
</html>
