<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка приложения - KristallCommunity</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/decorations.css">
    <style>
        .content { max-width: 600px; margin: 50px auto; background-color: #1f2937; padding: 40px; border-radius: 12px; border: 1px solid #374151; }
        .btn-download { display: inline-block; background-color: #10b981; color: white; padding: 15px 30px; font-size: 18px; font-weight: bold; text-decoration: none; border-radius: 6px; margin-top: 25px; transition: 0.2s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2); }
        .btn-download:hover { background-color: #059669; transform: translateY(-2px); }
        .back-link { display: block; margin-top: 30px; color: #9ca3af; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #10b981; }
    </style>
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- НАВИГАЦИЯ (HEADER) — ИСПРАВЛЕННЫЙ ИДЕАЛЬНЫЙ ВАРИАНТ -->
    <header>
        <div class="container header-wrapper" style="display: flex; justify-content: space-between; align-items: center; position: relative;">
            
            <!-- Левая часть: Логотип -->
            <a href="index.html" class="logo">KristallCommunity</a>
            
            <!-- Правая часть: Меню и Аватарки -->
            <div style="display: flex; align-items: center; gap: 20px;">
                
                <!-- Меню навигации -->
                <nav id="nav-menu">
                    <!-- Профиль для ТЕЛЕФОНОВ (виден только внутри шторки бургера) -->
                    <div class="menu-profile mobile-profile-block" style="display: none; align-items: center; gap: 10px; padding-bottom: 20px; border-bottom: 1px solid #1f2937; margin-bottom: 20px; cursor: pointer;">
                        <span id="header-avatar-img-mobile"></span>
                        <span class="menu-username" id="header-username-mobile">Гость</span>
                    </div>
                    <ul>
                        <li><a href="index.html">Главная</a></li>
                        <li><a href="projects.html" class="active">Проекты</a></li>
                        <li><a href="marketplace.html">Магазин</a></li>
                    </ul>
                </nav>

                <!-- ПРОФИЛЬ ДЛЯ ПК (Красиво стоит справа от меню на больших экранах) -->
                <div class="pc-profile-block" id="user-profile-block" style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                    <span id="header-avatar-img-pc"></span>
                    <span class="menu-username" id="header-username" style="color: white; font-weight: bold; font-size: 14px;">Гость</span>
                </div>

                <!-- Кнопка Бургера (3 полоски для мобилок) -->
                <button class="burger-menu" id="burger-btn" aria-label="Открыть меню">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
            </div>
        </div>
    </header>

    <!-- ДИНАМИЧЕСКИЙ ШАБЛОН ИГРЫ (STEAM STYLE) -->
    <div class="container" style="max-width: 800px; margin: 0 auto; padding: 20px; font-family: sans-serif;">
        <div class="content" style="background-color: #1a2332; border-radius: 12px; padding: 30px; color: #ffffff;">
            
            <h1 id="game-title" style="color: white; margin-top: 0; font-size: 32px;">Загрузка...</h1>
            <p id="game-short-desc" style="color: #9ca3af; line-height: 1.6; font-size: 16px; margin-bottom: 25px;"></p>
            
            <!-- Сюда твой JS вставит адаптивные и красивые кнопки скачивания -->
            <div id="game-download-btn"></div> 
            
            <div style="text-align: left; margin-top: 40px; border-top: 1px solid #374151; padding-top: 25px;">
                
                <!-- 1. МЕДИАЗОНА -->
                <div style="display: flex; flex-direction: column; gap: 25px; margin-bottom: 35px;">
                    <!-- Официальный трейлер -->
                    <div id="trailer-block" style="display: none;">
                        <h3 style="color: #22d3ee; font-size: 16px; font-weight: bold; margin-bottom: 12px; padding-left: 0;">Официальный видео-трейлер</h3>
                        <div id="trailer-container" style="width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden;">
                            <!-- Сюда JS вставит плеер -->
                        </div>
                    </div>

                    <!-- Галерея скриншотов -->
                    <div id="screenshots-block" style="display: none;">
                        <h3 style="color: #22d3ee; font-size: 16px; font-weight: bold; margin-bottom: 12px; padding-left: 0;">Скриншоты</h3>
                        <div id="screenshots-container">
                            <!-- Сюда JS подставит твои картинки с шиммерами -->
                        </div>
                    </div>
                </div>

                <!-- БЛОК ОБНОВЛЕНИЙ "ЧТО НОВОГО" -->
                <div id="whats-new-block" style="display: none; margin-bottom: 25px; padding: 15px 20px; background: rgba(34, 211, 238, 0.05); border-left: 4px solid #22d3ee; border-radius: 0 8px 8px 0;">
                    <h3 style="color: #22d3ee; font-size: 16px; font-weight: bold; margin-top: 0; margin-bottom: 12px;">Что нового?</h3>
                    <ul id="game-whats-new-list" style="margin: 0; padding-left: 0;">
                        <!-- Сюда JS вставит список изменений -->
                    </ul>
                </div>

                <!-- 2. ПОДРОБНОЕ ТЕКСТОВОЕ ОПИСАНИЕ -->
                <div id="desc-block" style="margin-bottom: 25px;">
                    <h3 style="color: #22d3ee; font-size: 16px; font-weight: bold; margin-bottom: 12px;">О проекте</h3>
                    <p id="game-full-desc" style="color: #d1d5db; line-height: 1.6; font-size: 14px; margin: 0;"></p>
                </div>

                <!-- КЛЮЧЕВЫЕ ОСОБЕННОСТИ -->
                <div id="features-block" style="margin-top: 25px; margin-bottom: 25px; display: none;">
                    <h3 style="color: #22d3ee; font-size: 16px; font-weight: bold; margin-bottom: 12px;">Ключевые особенности:</h3>
                    <ul id="game-features" style="color: #d1d5db; line-height: 1.8; font-size: 14px; padding-left: 20px; list-style: none;"></ul>
                </div>

                <!-- ИНСТРУКЦИЯ ПО УСТАНОВКЕ -->
                <div id="instruction-block" style="display: none; margin-top: 25px; margin-bottom: 25px;">
                    <h3 style="color: #22d3ee; font-size: 16px; font-weight: bold; margin-bottom: 12px;">Как установить?</h3>
                    <ol id="instruction-list" style="color: #9ca3af; line-height: 1.6; font-size: 13px; padding-left: 20px; margin: 0;"></ol>
                </div>

                <!-- ТЕХНИЧЕСКИЕ ХАРАКТЕРИСТИКИ -->
                <table style="width: 100%; margin-top: 35px; border-collapse: collapse; font-size: 13px; color: #9ca3af;">
                    <tr style="border-bottom: 1px solid #374151;">
                        <td style="padding: 8px 0; font-weight: bold; color: #d1d5db;">Платформа:</td>
                        <td id="game-platform" style="padding: 8px 0; text-align: right;">-</td>
                    </tr>
                    <tr style="border-bottom: 1px solid #374151;">
                        <td style="padding: 8px 0; font-weight: bold; color: #d1d5db;">Текущая версия:</td>
                        <td id="game-version" style="padding: 8px 0; text-align: right;">-</td>
                    </tr>
                    <tr>
                        <td style="padding: 8px 0; font-weight: bold; color: #d1d5db;">Разработчик:</td>
                        <td id="game-developer" style="padding: 8px 0; text-align: right; color: #22d3ee; font-weight: 500;">-</td>
                    </tr>
                </table>

            </div>

            <a href="projects.html" class="back-link" style="margin-top: 40px; display: inline-block; color: #9ca3af; text-decoration: none; font-size: 14px; transition: color 0.2s;">← Вернуться в каталог</a>
        </div>
    </div>

    <!-- ВЕЛИКАЯ СВЯЗКА СКРИПТОВ KRISTALL (СТРОГИЙ ПОРЯДОК ПОДКЛЮЧЕНИЯ!) -->
    <script src="js/core.js"></script>
    <script src="js/content.js"></script>
    <script src="js/interface.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
